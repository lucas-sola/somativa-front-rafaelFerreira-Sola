<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Crie sua Tier List personalizada. Faça upload de imagens, arraste e solte para classificar, e exporte como PNG." />
  <title>Tier List Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/css/output.css" />
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 font-sans antialiased">

  <!-- ======== NAVBAR (flexbox manual — 10pts) ======== -->
  <nav class="flex items-center justify-between px-4 py-3 md:px-8 bg-gray-900 border-b border-gray-800 shadow-lg sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🏆</span>
      <h1 class="text-lg md:text-xl font-extrabold tracking-tight bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
        Tier List Maker
      </h1>
    </div>
    <div class="flex items-center gap-2 md:gap-3">
      <!-- Upload button -->
      <label
        for="image-upload"
        class="flex items-center gap-2 px-3 py-2 md:px-4 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-lg cursor-pointer transition-colors duration-200 shadow-md hover:shadow-indigo-500/30"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span class="hidden md:inline">Upload</span>
      </label>
      <input type="file" id="image-upload" multiple accept="image/*" class="sr-only" />

      <!-- Add row button -->
      <button
        id="btn-add-row"
        class="flex items-center gap-2 px-3 py-2 md:px-4 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-lg transition-colors duration-200 shadow-md hover:shadow-emerald-500/30"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span class="hidden md:inline">Adicionar Linha</span>
      </button>

      <!-- Download PNG button -->
      <button
        id="btn-download"
        class="flex items-center gap-2 px-3 py-2 md:px-4 bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold rounded-lg transition-colors duration-200 shadow-md hover:shadow-amber-500/30"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span class="hidden md:inline">Baixar PNG</span>
      </button>
    </div>
  </nav>

  <!-- ======== MAIN CONTENT ======== -->
  <main class="max-w-6xl mx-auto px-3 py-6 md:px-6 lg:px-8">

    <!-- Tier rows container (export target) -->
    <div id="tier-container" class="flex flex-col gap-1 rounded-xl overflow-hidden shadow-2xl shadow-black/50 border border-gray-800">
      <!-- Rows rendered by JS -->
    </div>

    <!-- ======== IMAGE POOL (grid responsivo — 10pts) ======== -->
    <div
      id="image-pool"
      class="mt-8 p-4 md:p-6 border-2 border-dashed border-gray-700 rounded-xl bg-gray-900/50 min-h-[120px] transition-colors duration-200"
    >
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-4">
        Repositório de Imagens
      </h2>
      <!-- Grid responsivo com grid-cols-* e breakpoints md: e lg: -->
      <div id="pool-images" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-8 gap-2 md:gap-3">
        <!-- Images rendered by JS -->
      </div>
      <p id="pool-empty" class="text-center text-gray-600 text-sm py-8 hidden">
        Faça upload de imagens usando o botão acima ☝️
      </p>
    </div>
  </main>

  <!-- html2canvas CDN for PNG export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="./src/js/script.js"></script>
</body>
</html>
