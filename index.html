<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Crie sua Tier List personalizada. Faça upload de imagens, arraste e solte para classificar, e exporte como PNG." />
  <title>Tier List Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/css/output.css" />
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 font-sans antialiased">
  <!-- ======== NAVBAR (Dynamic Glassmorphism & Hover Animations) ======== -->
  <nav
    id="main-nav"
    class="flex items-center justify-between px-4 py-3 md:px-8 bg-gray-900/80 backdrop-blur-md border-b border-gray-800 shadow-lg sticky top-0 z-50 transition-all duration-300"
  >
    <div class="flex items-center gap-3">
      <span class="text-2xl transition-transform duration-300 hover:scale-125 hover:rotate-12 cursor-pointer">🏆</span>
      <h1 class="text-lg md:text-xl font-extrabold tracking-tight bg-gradient-to-r from-amber-400 via-orange-400 to-amber-500 bg-clip-text text-transparent">
        Tier List Maker
      </h1>

      <!-- Dynamic Live Stats Counter -->
      <div id="nav-stats" class="hidden sm:flex items-center gap-2 px-3 py-1 bg-gray-800/80 border border-gray-700/60 rounded-full text-xs text-gray-300 font-medium transition-all shadow-inner ml-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="stat-count">0 Imagens</span>
      </div>
    </div>

    <div class="flex items-center gap-2 md:gap-3">
      <!-- Upload button -->
      <label
        for="image-upload"
        class="group flex items-center gap-2 px-3 py-2 md:px-4 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-lg cursor-pointer transition-all duration-200 shadow-md hover:shadow-indigo-500/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-95"
      >
        <svg class="w-4 h-4 transition-transform duration-200 group-hover:scale-110 group-hover:rotate-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span class="hidden md:inline">Upload</span>
      </label>
      <input type="file" id="image-upload" multiple accept="image/*" class="sr-only" />

      <!-- Add row button -->
      <button
        id="btn-add-row"
        class="group flex items-center gap-2 px-3 py-2 md:px-4 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-lg transition-all duration-200 shadow-md hover:shadow-emerald-500/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 cursor-pointer"
      >
        <svg class="w-4 h-4 transition-transform duration-200 group-hover:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span class="hidden md:inline">Adicionar Linha</span>
      </button>

      <!-- Download PNG button -->
      <button
        id="btn-download"
        class="group flex items-center gap-2 px-3 py-2 md:px-4 bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold rounded-lg transition-all duration-200 shadow-md hover:shadow-amber-500/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 cursor-pointer"
      >
        <svg class="w-4 h-4 transition-transform duration-200 group-hover:translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span class="hidden md:inline">Baixar PNG</span>
      </button>
    </div>
  </nav>

  <!-- ======== MAIN CONTENT ======== -->
  <main class="max-w-6xl mx-auto px-3 py-6 md:px-6 lg:px-8">

    <!-- Tier rows container (export target) -->
    <div id="tier-container" class="flex flex-col gap-1 rounded-xl overflow-hidden shadow-2xl shadow-black/60 border border-gray-800/80">
      <!-- Rows rendered by JS -->
    </div>

    <!-- ======== IMAGE POOL (grid responsivo — 10pts) ======== -->
    <div
      id="image-pool"
      class="mt-8 p-4 md:p-6 border-2 border-dashed border-gray-700/80 rounded-xl bg-gray-900/40 min-h-[120px] transition-all duration-300 hover:border-indigo-500/50 hover:bg-gray-900/60"
    >
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xs md:text-sm font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
          <span>📦 Repositório de Imagens</span>
        </h2>
        <span id="pool-count-badge" class="text-xs text-gray-500 bg-gray-800 px-2 py-0.5 rounded-full font-medium">0 imagens</span>
      </div>
      <!-- Grid responsivo com grid-cols-* e breakpoints md: e lg: -->
      <div id="pool-images" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-8 gap-2 md:gap-3">
        <!-- Images rendered by JS -->
      </div>
      <p id="pool-empty" class="text-center text-gray-500 text-sm py-8 hidden font-medium">
        Faça upload de imagens usando o botão acima ☝️
      </p>
    </div>
  </main>

  <!-- ======== MODAL DE VISUALIZAÇÃO AMPLIADA ======== -->
  <div
    id="image-modal"
    class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 transition-all duration-200"
    aria-hidden="true"
  >
    <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col shadow-2xl relative animate-modal-entry">
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-800 bg-gray-900/90">
        <h3 id="modal-title" class="text-base md:text-lg font-bold text-gray-100 truncate max-w-[80%]">
          Visualizar Imagem
        </h3>
        <button
          id="modal-close"
          class="p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-colors cursor-pointer"
          aria-label="Fechar visualização"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Modal Body (Image Container) -->
      <div class="flex-1 flex items-center justify-center p-4 md:p-6 bg-gray-950 overflow-auto min-h-[300px]">
        <img
          id="modal-img"
          src=""
          alt=""
          class="max-w-full max-h-[70vh] object-contain rounded-lg shadow-2xl transition-transform duration-300 hover:scale-105"
        />
      </div>
    </div>
  </div>

  <!-- html2canvas CDN for PNG export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="./src/js/script.js"></script>
</body>
</html>
